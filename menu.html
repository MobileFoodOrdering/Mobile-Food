
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusFood - Menu</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}
header{background:#ff6b00;color:white;text-align:center;padding:20px}
nav{background:white;text-align:center;padding:14px}
nav a{display:inline-block;margin:5px 8px;color:#ff6b00;text-decoration:none;font-weight:bold}
.container{max-width:750px;margin:auto;padding:16px}
.food,.cart{background:white;padding:15px;margin:12px 0;border-radius:10px;box-shadow:0 2px 5px #ccc}
.food h3{margin:0 0 8px}
button{background:#ff6b00;color:white;border:0;border-radius:6px;padding:10px 14px;margin:4px;cursor:pointer}
button:disabled{opacity:.6}
.remove{background:#d32f2f}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;margin:8px 0}
.total{font-size:20px;font-weight:bold}
#message{font-weight:bold;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>CampusFood</h1>
<p>Mobile Food Ordering System for Students and Faculty</p>
</header>

<nav>
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="orders.html">My Orders</a>
<a href="admin-login.html">Admin</a>
</nav>

<div class="container">
<h2>🍽️ Available Food</h2>
<div id="foodList">Loading menu...</div>

<div class="cart">
<h2>🛒 Your Cart</h2>
<label for="customerName">Your name</label>
<input id="customerName" maxlength="100" placeholder="Enter your name" autocomplete="name">
<div id="cartList">Your cart is empty.</div>
<p class="total">Total: ₱<span id="total">0.00</span></p>
<button id="checkout">Place Order</button>
<p id="message" role="status"></p>
</div>
</div>

<script>
const API = "https://mobile-food.sntsnathaniel.workers.dev/orders";

const foods = [
{name:"Chicken Rice",price:65},
{name:"Burger",price:50},
{name:"French Fries",price:35},
{name:"Spaghetti",price:60},
{name:"Iced Tea",price:25},
{name:"Chicken Adobo with Rice",price:75},
{name:"Pork Menudo with Rice",price:80},
{name:"Pork Sinigang with Rice",price:85},
{name:"Chicken Tinola with Rice",price:75},
{name:"Bistek Tagalog with Rice",price:85},
{name:"Pork Giniling with Rice",price:70},
{name:"Fried Bangus with Rice",price:80},
{name:"Lumpiang Shanghai with Rice",price:65},
{name:"Tapsilog",price:85},
{name:"Longsilog",price:75},
{name:"Tocilog",price:75},
{name:"Pork BBQ with Rice",price:80},
{name:"Pork Sisig with Rice",price:85},
{name:"Kare-Kare with Rice",price:100},
{name:"Pinakbet with Rice",price:65}
];

let cart = [];

const foodList = document.getElementById("foodList");
const cartList = document.getElementById("cartList");
const totalDisplay = document.getElementById("total");
const message = document.getElementById("message");
const checkoutButton = document.getElementById("checkout");

function showFoods() {
  foodList.innerHTML = "";

  foods.forEach(food => {
    const card = document.createElement("div");
    card.className = "food";

    const name = document.createElement("h3");
    name.textContent = food.name;

    const price = document.createElement("p");
    price.textContent = "Price: ₱" + food.price.toFixed(2);

    const button = document.createElement("button");
    button.textContent = "Add to Cart";
    button.onclick = () => {
      const existing = cart.find(item => item.name === food.name);

      if (existing) {
        existing.qty++;
      } else {
        cart.push({...food, qty:1});
      }

      message.textContent = "";
      showCart();
    };

    card.append(name, price, button);
    foodList.appendChild(card);
  });
}

function showCart() {
  cartList.innerHTML = "";

  if (cart.length === 0) {
    cartList.textContent = "Your cart is empty.";
    totalDisplay.textContent = "0.00";
    return;
  }

  let sum = 0;

  cart.forEach((item, index) => {
    sum += item.price * item.qty;

    const row = document.createElement("div");
    row.className = "food";

    const details = document.createElement("p");
    details.textContent =
      item.name + " — ₱" + item.price.toFixed(2) +
      " × " + item.qty;

    const minus = document.createElement("button");
    minus.textContent = "−";
    minus.setAttribute("aria-label", "Decrease quantity");
    minus.onclick = () => {
      item.qty--;
      if (item.qty <= 0) cart.splice(index, 1);
      showCart();
    };

    const plus = document.createElement("button");
    plus.textContent = "+";
    plus.setAttribute("aria-label", "Increase quantity");
    plus.onclick = () => {
      if (item.qty < 50) item.qty++;
      showCart();
    };

    const remove = document.createElement("button");
    remove.className = "remove";
    remove.textContent = "Remove";
    remove.onclick = () => {
      cart.splice(index, 1);
      showCart();
    };

    row.append(details, minus, plus, remove);
    cartList.appendChild(row);
  });

  totalDisplay.textContent = sum.toFixed(2);
}

checkoutButton.onclick = async () => {
  if (cart.length === 0) {
    message.textContent = "Please add food to your cart.";
    return;
  }

  const customerName =
    document.getElementById("customerName").value.trim();

  if (!customerName) {
    message.textContent = "Please enter your name.";
    return;
  }

  checkoutButton.disabled = true;
  checkoutButton.textContent = "Sending order...";
  message.textContent = "Submitting your order...";

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        customer_name: customerName,
        items: cart.map(item => ({
          name: item.name,
          qty: item.qty
        }))
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Order submission failed.");
    }

    message.textContent =
      "Order submitted successfully! Your order is saved online.";

    cart = [];
    document.getElementById("customerName").value = "";
    showCart();
  } catch (error) {
    message.textContent =
      "Could not submit order. Please check your connection or ask the administrator to check the Worker.";
  } finally {
    checkoutButton.disabled = false;
    checkoutButton.textContent = "Place Order";
  }
};

showFoods();
showCart();
</script>
</body>
</html>
