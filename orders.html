<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusFood - My Orders</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#ff6b00;color:white;text-align:center;padding:20px}
nav{text-align:center;background:white;padding:15px}
nav a{margin:8px;color:#ff6b00;text-decoration:none;font-weight:bold}
.container{max-width:700px;margin:auto;padding:20px}
.order{background:white;padding:18px;margin:15px 0;border-radius:10px;box-shadow:0 2px 5px #ccc}
.status{font-weight:bold;color:#ff6b00;font-size:18px}
button{background:#ff6b00;color:white;border:0;padding:10px 15px;border-radius:6px}
</style>
</head>

<body>

<header>
<h1>CampusFood</h1>
<p>My Orders</p>
</header>

<nav>
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="orders.html">My Orders</a>
<a href="admin-login.html">Admin</a>
</nav>

<div class="container">

<h2>📦 Your Orders</h2>

<div id="orders">Loading orders...</div>

<button id="refresh">Refresh Orders</button>

</div>

<script>
// @ts-nocheck

const ordersBox=document.getElementById("orders");

function showOrders(){

let orders=
JSON.parse(localStorage.getItem("campusOrders"))||[];

ordersBox.innerHTML="";

if(!orders.length){

ordersBox.innerHTML="<p>No orders yet.</p>";
return;

}

for(let i=orders.length-1;i>=0;i--){

let order=orders[i];

let box=document.createElement("div");
box.className="order";

let items="";

for(let j=0;j<order.items.length;j++){

let item=order.items[j];
let qty=item.qty||1;

items+="<p>"+
item.name+
" × "+qty+
" — PHP "+
(Number(item.price)*qty).toFixed(2)+
"</p>";

}

box.innerHTML=
"<h3>Order #"+(i+1)+"</h3>"+
items+
"<p><strong>Total: PHP "+
Number(order.total).toFixed(2)+
"</strong></p>"+
"<p>Status: <span class='status'>"+
(order.status||"Pending")+
"</span></p>";

ordersBox.appendChild(box);

}

}

document.getElementById("refresh").onclick=showOrders;

showOrders();

setInterval(showOrders,3000);

</script>

</body>
</html>
